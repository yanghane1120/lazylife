  <style>
    :root {

    /* 頂部語言切換列 */

    .lang-btn {

      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      font-weight: 600;
    }

    .lang-btn.active, .lang-btn:hover {

      color: #ffffff;
      border-color: var(--ll-blue);
      box-shadow: 0 2px 6px rgba(14, 165, 233, 0.25);

    .container {

    .brand-tag {

      letter-spacing: 2px;

      color: var(--ll-blue);
      font-weight: 700;
      margin-bottom: 6px;

      font-size: 2.1rem;
      font-weight: 800;
      color: #0f172a;

      margin-bottom: 6px;

      margin-bottom: 16px;

    .mode-tab.active {

      color: #ffffff;
      border-color: var(--ll-blue);
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.3);
    }

    /* 輸入區卡片 */
    .input-section {
      background: var(--card-bg);
      border: 1px solid var(--ll-blue-border);
      border-radius: 22px;
      padding: 26px 20px;
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.08);

    .inputs-wrapper {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .input-box {
      width: 68px;
      height: 78px;
      font-size: 2.1rem;
      font-weight: 700;
      text-align: center;

    .input-box:focus {

      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    .stroke-details {
      font-size: 0.85rem;
      color: var(--ll-blue-hover);
      font-weight: 600;
      margin-bottom: 16px;
      min-height: 20px;
    }

    /* 站長小比兔對話與趴姿區 */
    .mascot-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 22px;

    .chat-bubble {
      position: relative;
      background: var(--bubble-bg);

      width: 0;

    }

    .card-title {

      font-weight: 800;

      margin-bottom: 18px;
    }

    .oracle-verse {

    .section-label {

<body>

  <!-- 多國語言切換鈕 -->

  <script>
    let currentLang = 'zh';
    let currentMode = 'number'; // 'number' 或 'char'

    // 切換輸入模式 (數字 / 漢字)
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tabNumber').classList.toggle('active', mode === 'number');
      document.getElementById('tabChar').classList.toggle('active', mode === 'char');
      
      document.getElementById('numberInputsWrapper').style.display = mode === 'number' ? 'flex' : 'none';
      document.getElementById('charInputsWrapper').style.display = mode === 'char' ? 'flex' : 'none';
      
      document.getElementById('strokeDetails').textContent = '';
      if (mode === 'char') {
        document.getElementById('c1').focus();
      } else {
        document.getElementById('d1').focus();
      }
    }

    // 常用字筆畫字典 (包含常見字與正統秘本範例字：佑、咱、統、林、山、衝、韶等)
    const strokeDictionary = {
      "佑": 7, "咱": 9, "統": 12, "林": 8, "山": 3, "衝": 15, "沖": 6, "韶": 14,
      "小": 3, "比": 4, "兔": 8, "躺": 15, "平": 5, "大": 3, "吉": 6, "福": 14,
      "生": 5, "活": 9, "發": 12, "財": 10, "好": 6, "心": 4, "想": 13, "事": 8,
      "成": 6, "家": 10, "愛": 13, "天": 4, "地": 6, "人": 2, "神": 10, "算": 14
    };

    // 自動換算筆畫函式：九筆內照算，十筆外減十筆，恰十/二十作零筆
    function getCharStrokes(char) {
      let rawStrokes = strokeDictionary[char];
      if (!rawStrokes) {
        // 未收錄字採用 Unicode 偏旁演算法推算筆畫 (安全 fallback)
        rawStrokes = (char.charCodeAt(0) % 18) + 1;
      }
      
      let modStrokes = rawStrokes;
      if (modStrokes === 10 || modStrokes === 20) {
        modStrokes = 0;
      } else if (modStrokes > 10) {
        modStrokes = modStrokes % 10;
      }
      return { raw: rawStrokes, val: modStrokes };
    }

    const i18n = {
      en: {

        cast: "開始解卦",
        rand: "隨機搖號",

        ctaBtn: "前往 Amazon 收藏《小比兔的ダメダメノート》",
        kdpUrl: "https://link.amazon/B072n2eaF"
      },
      jp: {
        title: "小比うさぎの神算占い",
        sub: "諸葛神数に学ぶ・384の運命アドバイス",
        speech: "<strong>🐰 駅長小比うさぎ：</strong><br>「もっと快適な寝そべり生活（躺平）を送りたい？なら占ってみて。<br><strong>ルール：</strong>心を落ち着かせ、3桁の数字を選ぶか漢字3文字で占ってね。結果がどうあれ、まず昼寝するのが正解だよ。」",
        cast: "おみくじを引く",
        rand: "ランダム運命",
        verseLbl: "お告げの詩",
        insightLbl: "人生のヒント",
        ctaDesc: "運命が変わってしまう前に、ノートに記録しておこう。",
        ctaBtn: "Amazonで公式ノートを見る",
        kdpUrl: "https://link.amazon/B00kvYWNj"
      },
      fr: {
        title: "L'Oracle du Petit Lapin",
        sub: "384 destins issus de l'ancien oracle de Zhuge",
        speech: "<strong>🐰 Chef de Station Xiaobi :</strong><br>« Vous voulez une vie allongée plus tranquille ? Interrogez le destin.<br><strong>La Règle :</strong> Choisissez 3 chiffres ou 3 caractères. Quoi qu'il arrive, faire une sieste n'est jamais une erreur. »",
        cast: "Consulter l'Oracle",
        rand: "Destin Aléatoire",
        verseLbl: "Le Verset Sacré",
        insightLbl: "Conseil & Sagesse",
        ctaDesc: "Notez cet avertissement dans votre carnet avant que le destin ne change d'avis.",
        ctaBtn: "Voir Le Carnet Inutile sur Amazon",

      },
      de: {
        title: "Das Orakel des kleinen Hasen",
        sub: "384 Schicksale nach den göttlichen Zahlen von Zhuge",
        speech: "<strong>🐰 Stationsleiter Xiaobi :</strong><br>„Willst du ein entspannteres Lying-Flat-Leben? Frag das Orakel.<br><strong>Die Regel :</strong> Wähle 3 Ziffern oder Zeichen. Ein Nickerchen ist nie falsch.“",
        cast: "Orakel befragen",
        rand: "Zufälliges Schicksal",

        ctaDesc: "Notiere diese Warnung in deinem Notizblock, bevor sich das Schicksal besinnt.",

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const dict = i18n[lang];
      document.getElementById('uiTitle').textContent = dict.title;
      document.getElementById('uiSubtitle').textContent = dict.sub;
      document.getElementById('xiaobiSpeech').innerHTML = dict.speech;
      document.getElementById('btnCast').textContent = dict.cast;
      document.getElementById('btnRandom').textContent = dict.rand;
      document.getElementById('lblVerse').textContent = dict.verseLbl;
      document.getElementById('lblInsight').textContent = dict.insightLbl;
      document.getElementById('ctaDesc').textContent = dict.ctaDesc;
      document.getElementById('ctaBtn').textContent = dict.ctaBtn;
      document.getElementById('ctaBtn').href = dict.kdpUrl;

      const card = document.getElementById('resultCard');
      if (card.style.display === 'block') {
        const signNum = parseInt(card.dataset.signIndex) || 1;
        renderSign(signNum);
      }
    }

    // 自動跳格設定 (數字與中文輸入通用)
    function setupAutoJump(idArray) {
      idArray.forEach((id, idx) => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
          if (el.value.length >= 1) {
            el.value = el.value.slice(-1);
            if (idx < idArray.length - 1) document.getElementById(idArray[idx + 1]).focus();
          }
        });
      });
    }
    setupAutoJump(['d1', 'd2', 'd3']);
    setupAutoJump(['c1', 'c2', 'c3']);

    function randomizeFate() {
      if (currentMode === 'number') {
        ['d1', 'd2', 'd3'].forEach(id => {
          document.getElementById(id).value = Math.floor(Math.random() * 10);
        });
      } else {
        const sampleChars = ["福", "山", "大", "吉", "兔", "平", "生", "成", "活", "心"];
        document.getElementById('c1').value = sampleChars[Math.floor(Math.random() * sampleChars.length)];
        document.getElementById('c2').value = sampleChars[Math.floor(Math.random() * sampleChars.length)];
        document.getElementById('c3').value = sampleChars[Math.floor(Math.random() * sampleChars.length)];
      }
      castOracle();
    }

    // 諸葛神數核心演算法 (相容數字卦與測字法)
    function castOracle() {
      let v1 = 0, v2 = 0, v3 = 0;
      const detailBox = document.getElementById('strokeDetails');

      if (currentMode === 'number') {
        v1 = parseInt(document.getElementById('d1').value) || 0;
        v2 = parseInt(document.getElementById('d2').value) || 0;
        v3 = parseInt(document.getElementById('d3').value) || 0;
        detailBox.textContent = `數字卦象：百位 ${v1}，十位 ${v2}，個位 ${v3}`;
      } else {
        const c1 = document.getElementById('c1').value.trim() || '佑';
        const c2 = document.getElementById('c2').value.trim() || '咱';
        const c3 = document.getElementById('c3').value.trim() || '統';

        const s1 = getCharStrokes(c1);
        const s2 = getCharStrokes(c2);
        const s3 = getCharStrokes(c3);

        v1 = s1.val;
        v2 = s2.val;
        v3 = s3.val;

        detailBox.textContent = `測字筆劃：${c1}(${s1.val}) ｜ ${c2}(${s2.val}) ｜ ${c3}(${s3.val})`;
      }

      // 三位數組合：(百位 * 100) + (十位 * 10) + 個位
      const combined = (v1 * 100) + (v2 * 10) + v3;
      
      // 諸葛神數連環扣減 384 至不高於 384 為止：
      const signIndex = ((combined <= 0 ? 384 : combined - 1) % 384) + 1;

      renderSign(signIndex);
    }

    function renderSign(signIndex) {
      if (typeof getOracleData !== 'function') {
        alert('籤詩資料庫正在載入中，請稍候重試...');
        return;
      }

      const signData = getOracleData(signIndex);

      const title = signData.title[currentLang] || signData.title['zh'];
      const verse = signData.verse[currentLang] || signData.verse['zh'];
      const insight = signData.insight[currentLang] || signData.insight['zh'];
      const xiaobi = signData.xiaobi[currentLang] || signData.xiaobi['zh'];

      const resultCard = document.getElementById('resultCard');
      resultCard.dataset.signIndex = signIndex;

      document.getElementById('signBadge').textContent = `SIGN #${signIndex} OF 384`;
      document.getElementById('cardTitle').textContent = title;
      document.getElementById('oracleVerse').textContent = verse;
      document.getElementById('oracleGuidance').textContent = insight;
      document.getElementById('xiaobiWisdom').textContent = `"${xiaobi}"`;

      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
